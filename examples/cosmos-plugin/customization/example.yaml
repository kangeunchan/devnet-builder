network_profiles:
  mainnet:
    chain_id: cosmoshub-4
    rpc_endpoint: https://cosmoshub.rpc.kjnodes.com
    rest_endpoint: https://cosmoshub.api.kjnodes.com
    snapshot_index_url: https://www.polkachu.com/tendermint_snapshots/cosmos
  testnet:
    chain_id: provider
    rpc_endpoint: https://cosmoshub-testnet.rpc.kjnodes.com
    rest_endpoint: https://cosmoshub-testnet.api.kjnodes.com
    snapshot_index_url: https://www.polkachu.com/testnets/cosmos/snapshots

endpoints:
  rest_to_rpc_host_map: {}
  rpc_to_rest_host_map: {}

snapshot:
  resolver_timeout: 10s
  mainnet_url_pattern: https://snapshots\.polkachu\.com/snapshots/cosmos/cosmos_[0-9]+\.tar\.[a-z0-9]+
  testnet_url_pattern: https://snapshots\.polkachu\.com/testnet-snapshots/cosmos/cosmos_[0-9]+\.tar\.[a-z0-9]+

timeouts:
  request_timeout: 15s
  wait_block_timeout: 10m

funding:
  validator_balance: 1000000000000uatom
  account_balance: 100000000000uatom
  invalid_balance_policy: fallback
  validator_stake_default: "100000000"

runtime:
  binary_name: gaiad
  docker_image: ghcr.io/cosmos/gaia:v25.3.2
  docker_home_dir: /home/gaia
  default_node_home: /root/.gaia

genesis_policy:
  require_validators: true

rpc_policy:
  unsupported_network_behavior: empty
